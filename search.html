<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>データ検索</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        form div { margin-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #999; padding: 6px 10px; text-align: left; vertical-align: top; }
        th { background: #eee; }
        td.detail { white-space: pre-wrap; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h1>BIO Watch データ検索</h1>

    <form id="search-form">
        <div>キーワード（タイトル・地域・詳細）
            <input type="text" name="keyword" id="keyword">
        </div>
        <div>地域(都道府県)
            <input type="text" name="area" id="area">
        </div>
        <div>
            <button type="submit">検索</button>
            <a href="#" id="clear">条件クリア</a>
            ／ <a href="./index.html">入力画面へ</a>
        </div>
    </form>

    <p id="message"></p>
    <div id="result"></div>

    <script src="./csv.js"></script>
    <script>
        const form    = document.getElementById('search-form');
        const message = document.getElementById('message');
        const result  = document.getElementById('result');
        let allRows = null;

        function showError(text) {
            message.className = 'error';
            message.textContent = text;
            result.replaceChildren();
        }

        function render() {
            const keyword = form.keyword.value.trim();
            const area    = form.area.value.trim();

            const hits = [];
            allRows.forEach(function (row, i) {
                if (area !== '' && !contains(row.area, area)) return;
                if (keyword !== '' && !(contains(row.title, keyword) || contains(row.area, keyword) || contains(row.detail, keyword))) return;
                hits.push({ id: i, row: row });
            });

            message.className = '';
            message.textContent = hits.length + ' 件見つかりました。';
            result.replaceChildren();
            if (hits.length === 0) return;

            const table = document.createElement('table');
            const head = table.insertRow();
            ['タイトル', '地域', '詳細'].forEach(function (t) {
                const th = document.createElement('th');
                th.textContent = t;
                head.appendChild(th);
            });

            hits.forEach(function (h) {
                const tr = table.insertRow();

                const a = document.createElement('a');
                a.href = './detail.html?id=' + h.id;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = h.row.title !== '' ? h.row.title : '(無題)';
                tr.insertCell().appendChild(a);

                tr.insertCell().textContent = h.row.area;

                const detail = tr.insertCell();
                detail.className = 'detail';
                detail.textContent = h.row.detail;
            });
            result.appendChild(table);
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (allRows) render();
        });

        document.getElementById('clear').addEventListener('click', function (e) {
            e.preventDefault();
            form.reset();
            if (allRows) render();
        });

        // 画面を開いた時点でCSVを読み込み、全件を表示する
        message.textContent = '読み込み中...';
        loadRows().then(function (rows) {
            allRows = rows;
            render();
        }).catch(function () {
            showError('CSVファイルを読み込めませんでした。GitHub Pagesの公開アドレス、または手元では http://localhost:8000/ のように、サーバー経由で開いているか確認してください。');
        });
    </script>
</body>
</html>
