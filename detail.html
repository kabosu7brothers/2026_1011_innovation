<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>詳細</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 800px; }
        dt { font-weight: bold; margin-top: 15px; }
        dd { margin: 5px 0 0 0; white-space: pre-wrap; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h1>詳細</h1>

    <p id="error" class="error" hidden></p>
    <dl id="content" hidden>
        <dt>タイトル</dt><dd id="title"></dd>
        <dt>地域(都道府県)</dt><dd id="area"></dd>
        <dt>詳細</dt><dd id="detail"></dd>
    </dl>

    <p>
        <button type="button" onclick="window.close()">このタブを閉じる</button>
        ／ <a href="./search.html">検索画面へ</a>
    </p>

    <script src="./csv.js"></script>
    <script>
        (function () {
            const errorEl = document.getElementById('error');

            function showError(text) {
                errorEl.textContent = text;
                errorEl.hidden = false;
            }

            const idText = new URLSearchParams(location.search).get('id');
            if (idText === null || !/^\d+$/.test(idText)) {
                showError('表示するデータが指定されていません。');
                return;
            }

            loadRows().then(function (rows) {
                const row = rows[Number(idText)];
                if (!row) {
                    showError('該当するデータが見つかりませんでした。');
                    return;
                }
                document.getElementById('title').textContent  = row.title;
                document.getElementById('area').textContent   = row.area;
                document.getElementById('detail').textContent = row.detail;
                document.getElementById('content').hidden = false;
            }).catch(function () {
                showError('CSVファイルを読み込めませんでした。サーバー経由（GitHub Pagesの公開アドレスなど）で開いているか確認してください。');
            });
        })();
    </script>
</body>
</html>
