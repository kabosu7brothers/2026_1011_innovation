<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIOWatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>BIOWatch</h1>
        <p>生物多様性を知り、つなげ、未来のアイデアへ</p>
    </header>
    <main>
        <a href="./view.html">出力画面へ</a>
        <h2>生物を登録する</h2>
        <form id="animalForm"><!入力フォーム>
            <label>
                名前(必須)
                <input type="text" id="nameInput" required><!テキスト入力欄。requiredで入力必須にできる>
            </label>
            <label>
                地域(必須)
                <input type="text" id="areaInput" required><!テキスト入力欄。requiredで入力必須にできる>
            </label>
            <label>
                説明
                <textarea id="descriptionInput" rows="3"></textarea><!長文テキスト入力欄。rows=行数。>
            </label>
            <button type="submit" id="submitButton">登録する</button>
            <p id="message"></p><!id=メッセージとして登録された文字が表示される>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><!SupabaseのURL>
    <script src="script.js"></script>
</body>
</html>
