<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>データベーステスト</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        form > div { margin-bottom: 10px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #999; padding: 4px 8px; text-align: left; vertical-align: top; }
        th { background: #eee; }
        td.detail { white-space: pre-wrap; }
        .note { background: #fff8e1; border: 1px solid #e0c060; padding: 8px 12px; max-width: 800px; }
        .ok { color: #070; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h1>BIO Watchにようこそ!</h1>
    <p><a href="./search.html">検索画面へ</a></p>

    <p class="note">
        このページは静的ページなので、入力した内容をCSVファイルへ直接保存することはできません。<br>
        入力した内容は下の「追加した内容」にたまります。「CSVをダウンロード」で、いまのCSVに追加分を足したファイルを保存し、
        公開しているリポジトリの <code>test_csv.csv</code> と置き換えると、検索画面に反映されます。
    </p>

    <form id="save-form">
        <div>タイトル
            <input type="text" name="title">
        </div>
        <div>地域(都道府県)
            <input type="text" name="area">
        </div>
        <div>詳細</div>
        <textarea id="text1" name="text1" rows="10" cols="100" placeholder="ここに詳細な内容を記入してください。"></textarea>
        <div>入力を確定しますか？
            <button type="submit">確定</button>
        </div>
    </form>

    <p id="message"></p>

    <div id="pending-area" hidden>
        <h2>追加した内容（<span id="pending-count">0</span>件）</h2>
        <table id="pending-table">
            <tr><th>タイトル</th><th>地域</th><th>詳細</th></tr>
        </table>
        <p>
            <button type="button" id="download">CSVをダウンロード</button>
            <span id="download-note"></span>
        </p>
        <p class="note">このページを閉じたり再読み込みしたりすると、ダウンロードしていない追加分は消えます。</p>
    </div>

    <script src="./csv.js"></script>
    <script src="./save.js"></script>
</body>
</html>
